name: release

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without the v prefix"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Releases may only be created from the main branch."
            exit 1
          fi

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION="$(tr -d '\r\n' < VERSION)"
            if [[ "${VERSION}" == *-* ]]; then
              PRERELEASE=true
            else
              PRERELEASE=false
            fi
          else
            VERSION="${INPUT_VERSION}"
            PRERELEASE="${INPUT_PRERELEASE}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '${VERSION}'. Use a version such as 0.2.0-beta.1 or 1.0.0."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Require a new tag
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
            exit 1
          fi

  build:
    name: Build and test ${{ matrix.artifact }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux
            artifact: tailcat-linux-x86_64
            executable: tailcat
          - os: macos-latest
            preset: macos
            artifact: tailcat-macos-arm64
            executable: tailcat
          - os: windows-latest
            preset: windows
            artifact: tailcat-windows-x86_64
            executable: tailcat.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        shell: bash
        run: cmake --preset "${{ matrix.preset }}" -DTAILCAT_VERSION="${{ needs.validate.outputs.version }}" -DTAILCAT_BUILD_TESTS=ON

      - name: Build
        shell: bash
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Test
        shell: bash
        run: ctest --preset "${{ matrix.preset }}" --output-on-failure --timeout 180

      - name: Install release files
        shell: bash
        run: cmake --install "build/${{ matrix.preset }}" --prefix "dist/${{ matrix.artifact }}"

      - name: Verify binary version
        shell: bash
        run: |
          "dist/${{ matrix.artifact }}/bin/${{ matrix.executable }}" --version | tee version.txt
          grep -F "tailcat ${{ needs.validate.outputs.version }}" version.txt

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-check main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Releases may only be created from the main branch."
            exit 1
          fi

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tailcat-*
          path: release-assets

      - name: Package artifacts and checksums
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          tar -C release-assets/tailcat-linux-x86_64/bin             -czf "tailcat-${VERSION}-linux-x86_64.tar.gz" tailcat
          tar -C release-assets/tailcat-macos-arm64/bin             -czf "tailcat-${VERSION}-macos-arm64.tar.gz" tailcat
          (
            cd release-assets/tailcat-windows-x86_64/bin
            zip -9 "${GITHUB_WORKSPACE}/tailcat-${VERSION}-windows-x86_64.zip" tailcat.exe
          )
          sha256sum             "tailcat-${VERSION}-linux-x86_64.tar.gz"             "tailcat-${VERSION}-macos-arm64.tar.gz"             "tailcat-${VERSION}-windows-x86_64.zip"             > SHA256SUMS

      - name: Create tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=(
            "tailcat-${VERSION}-linux-x86_64.tar.gz"
            "tailcat-${VERSION}-macos-arm64.tar.gz"
            "tailcat-${VERSION}-windows-x86_64.zip"
            "SHA256SUMS"
          )
          args=(
            --target "${GITHUB_SHA}"
            --title "Tailcat v${VERSION}"
            --generate-notes
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "v${VERSION}" "${assets[@]}" "${args[@]}"
