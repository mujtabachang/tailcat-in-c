name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            artifact: tailcat-linux-x64
            binary: build/Release/tailcat
          - os: macos-latest
            triplet: arm64-osx
            artifact: tailcat-macos-arm64
            binary: build/Release/tailcat
          - os: windows-latest
            triplet: x64-windows
            artifact: tailcat-windows-x64.exe
            binary: build/Release/tailcat.exe
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/run-vcpkg@v11
      - name: Configure
        shell: bash
        run: cmake --preset ninja-multi-vcpkg -DTAILCAT_BUILD_TESTS=OFF
      - name: Build
        shell: bash
        run: cmake --build --preset ninja-multi-vcpkg --config Release
      - name: Stage artifact
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tailcat-linux-x64
            tailcat-macos-arm64
            tailcat-windows-x64.exe
